<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="player">
    <div class="cover">
      <img id="coverImage" src="photo1.webp" alt="cover image" />
    </div>

    <div class="song-info">
      <h2 id="songTitle">Loading...</h2>
      <p id="songArtist">Loading...</p>
    </div>

    <div class="progress-area">
      <input id="progress" class="progress-bar" type="range" min="0" value="0" step="1" />
      <div class="time">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </div>

    <div class="volume-area">
      <span>🔊</span>
      <input id="volume" type="range" min="0" max="1" value="0.8" step="0.01" />
    </div>

    <div class="controls">
      <button id="autoplay" type="button" title="Toggle autoplay" aria-label="Autoplay next song" aria-pressed="true">∞</button>
      <div class="track-controls">
        <button id="previousBtn" title="Previous">⏮</button>
        <button id="playBtn" title="Play/Pause">▶</button>
        <button id="nextBtn" title="Next">⏭</button>
      </div>
    </div>

    <ul id="playlist" class="playlist"></ul>

    <audio id="audio"></audio>
  </main>
  <script src="script.js"></script>
</body>
</html>
